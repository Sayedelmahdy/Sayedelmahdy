name: Contribution snake

on:
  schedule:
    - cron: "0 3 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#f0b449&color_dots=#1c1a17,#4a3b1f,#7a5a22,#b5822d,#f0b449&color_background=#0d1117
            dist/snake-light.svg?color_snake=#b5822d&color_dots=#ebedf0,#f6e3b8,#eec77a,#d9a441,#b5822d
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
